name: Homebridge
description: Homebridge - HomeKit support for the impatient
version: '2026-04-20'
url: https://hub.docker.com/r/homebridge/homebridge
panel_icon: mdi:bridge
image: homebridge/homebridge
arch:
  - aarch64
  - amd64
  - armv7
slug: homebridge
init: false
ingress: true
ingress_port: 8581
ingress_stream: true
host_network: true
video: true
backup_exclude:
  - node_modules
map:
  - path: /homebridge
    read_only: false
    type: addon_config
webui: http://[HOST]:[PORT:8581]
